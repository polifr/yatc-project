[package]
name = "ms-rust-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bb8-redis = "0.26.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
hyper = "1.11.0"
mockall = "0.15.0"
once_cell = "1.21.4"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", features = ["trace", "grpc-tonic"] }
opentelemetry-http = "0.32"
redis = "1.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "any", "postgres", "uuid", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = { version = "0.2.0" }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
utoipa-redoc = { version = "6.0.0", features = ["axum"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.24.1", features = ["v4"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
rdkafka = { version = "0.39.0" }

[target.'cfg(target_os = "windows")'.dependencies]
rdkafka = { version = "0.39.0", features = ["cmake-build"] }

# Ottimizzazioni da https://nnethercote.github.io/perf-book/build-configuration.html
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
