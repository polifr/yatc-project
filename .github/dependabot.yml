version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - gw-spring-cloud
      - ms-spring-reactive
      - ms-spring-servlet
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directories:
      - ms-rust-axum
    schedule:
      interval: "weekly"
    groups:
      opentelemetry:
        applies-to: version-updates
        patterns:
          - "opentelemetry"
          - "opentelemetry_sdk"
          - "opentelemetry-*"
          - "tracing-opentelemetry"
